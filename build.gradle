plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'project'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    // JitPack：用于 seed-checker
    maven { url "https://jitpack.io" }
    // 用于 noise-sampler（从截图看是 1.0.0）
    maven { url "https://repo.jellejurre.dev" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.seedfinding.com/" }
}

dependencies {
    // seed-checker（从 JitPack 获取）
    // 可用版本：1.0.0-1.17.1（截图确认存在）
    implementation('com.github.jellejurre:seed-checker:1.0.0-1.17.1') {
        transitive = false
    }

    // noise-sampler（从截图确认版本为 1.0.0）
    implementation 'com.github.KalleStruik:noise-sampler:1.0.0'

    // fabric-loader
    implementation 'net.fabricmc:fabric-loader:0.11.6'

    // Log4j
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
}

application {
    mainClass = 'project.Launcher'
}

shadowJar {
    archiveBaseName.set('LowYSwampHut')
    archiveClassifier.set('')
    archiveVersion.set('')
    manifest {
        attributes('Main-Class': 'project.CmdLineRunner')
    }
    mergeServiceFiles()
    transform(com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer)
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    includeEmptyDirs = false
}

tasks.named('build').configure {
    dependsOn shadowJar
}