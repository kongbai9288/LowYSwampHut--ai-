plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'project'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.seedfinding.com/" }
}

dependencies {
    // 从原仓库 build.gradle 提取的正确版本
    implementation 'com.github.jellejurre:seed-checker:1.0.0-1.17.1'
    implementation 'net.fabricmc:fabric-loader:0.11.6'
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
}

application {
    mainClass = 'project.Launcher'
}

shadowJar {
    archiveBaseName.set('LowYSwampHut')
    archiveClassifier.set('')
    archiveVersion.set('')
    manifest {
        attributes('Main-Class': 'project.CmdLineRunner')
    }
    mergeServiceFiles()
    transform(com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer)
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    includeEmptyDirs = false
}

tasks.named('build').configure {
    dependsOn shadowJar
}