plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'project'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    maven { url "https://maven.seedfinding.com/" }
    maven { url "https://nexus.seedfinding.com/repository/maven-public/" }
}

dependencies {
    // seed-checker（通过 JitPack）
    implementation 'com.github.jellejurre:seed-checker:1.0.0-1.17.1'
    
    // fabric-loader
    implementation 'net.fabricmc:fabric-loader:0.11.6'
    
    // SeedFinding 系列库
    implementation 'com.seedfinding:mc_core:1.200.0'
    implementation 'com.seedfinding:mc_math:1.200.0'
    implementation 'com.seedfinding:mc_seed:1.171.2'   // ✅ 关键修改
    implementation 'com.seedfinding:mc_biome:1.200.0'
    implementation 'com.seedfinding:mc_feature:1.200.0'
    implementation 'com.seedfinding:mc_noise:1.200.0'
    implementation 'com.seedfinding:mc_reversal:1.200.0'
    implementation 'com.seedfinding:mc_terrain:1.200.0'
    
    // Log4j
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
}

application {
    mainClass = 'project.Launcher'
}

shadowJar {
    archiveBaseName.set('LowYSwampHut')
    archiveClassifier.set('')
    archiveVersion.set('')

    manifest {
        attributes('Main-Class': 'project.CmdLineRunner')
    }

    mergeServiceFiles()
    transform(com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer)
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    includeEmptyDirs = false
}

tasks.named('build').configure {
    dependsOn shadowJar
}