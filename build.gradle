plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'project'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    // JitPack：用于获取 seed-checker[reference:4]
    maven { url "https://jitpack.io" }
    // Fabric 官方仓库：用于获取 fabric-loader[reference:6][reference:7]
    maven { url "https://maven.fabricmc.net/" }
    // SeedFinding 仓库：用于获取 mc_core, mc_seed 等[reference:8][reference:9]
    maven { url "https://maven.seedfinding.com/" }
}

dependencies {
    // 核心依赖：seed-checker（关闭传递依赖以避免版本冲突）
    implementation('com.github.jellejurre:seed-checker:1.0.0-1.17.1') {
        transitive = false
    }
    
    // 显式声明 fabric-loader[reference:11]
    implementation 'net.fabricmc:fabric-loader:0.11.6'
    
    // 显式声明 SeedFinding 系列库[reference:12]
    implementation 'com.seedfinding:mc_core:1.200.0'
    implementation 'com.seedfinding:mc_seed:1.171.2'  // mc_seed 版本独立，与 mc_core 不同步
    
    // Log4j
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
}

application {
    mainClass = 'project.Launcher'
}

shadowJar {
    archiveBaseName.set('LowYSwampHut')
    archiveClassifier.set('')
    archiveVersion.set('')

    manifest {
        attributes('Main-Class': 'project.CmdLineRunner')
    }

    mergeServiceFiles()
    transform(com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer)
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    includeEmptyDirs = false
}

tasks.named('build').configure {
    dependsOn shadowJar
}