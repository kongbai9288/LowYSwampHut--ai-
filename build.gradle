plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'project'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    // SeedFinding 官方 Maven 仓库（用于 mccore）
    maven {
        url 'https://maven.seedfinding.com'
    }
    // JitPack（用于 seedchecker）
    maven {
        url 'https://jitpack.io'
    }
}

dependencies {
    // seedchecker（通过 JitPack）
    implementation 'com.github.jellejurre:seed-checker:1.0.0-1.17.1'
    
    // mccore（通过 SeedFinding Maven）
    implementation 'com.seedfinding:mc_core:1.0.0'
    
    // Log4j
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
}

application {
    mainClass = 'project.Launcher'
}

shadowJar {
    archiveBaseName.set('LowYSwampHut')
    archiveClassifier.set('')
    archiveVersion.set('')

    manifest {
        attributes('Main-Class': 'project.CmdLineRunner')
    }

    mergeServiceFiles()
    transform(com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer)
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    includeEmptyDirs = false
}

tasks.named('build').configure {
    dependsOn shadowJar
}