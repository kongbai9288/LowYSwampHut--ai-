plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'project'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url = "https://maven.seedfinding.com/" }
    maven { url = "https://repo.jellejurre.dev" }
}

dependencies {
    // ✅ 唯一正确的 SeedChecker 坐标
    implementation('com.github.jellejurre:seed-checker:1.2.0-1.17.1-pre1') {
        transitive = false
    }

    // ✅ MC Core 正式版（它自己带 mc_math / mc_seed）
    implementation 'com.seedfinding:mc_core:1.210.0'
    implementation 'com.seedfinding:mc_feature:1.171.9'

    // ✅ Log4j（SeedChecker / MC 必须）
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
}

application {
    mainClass = 'project.Launcher'
}

shadowJar {
    archiveBaseName.set('LowYSwampHut')
    archiveClassifier.set('')
    archiveVersion.set('')

    manifest {
        attributes 'Main-Class': 'project.CmdLineRunner'
    }

    mergeServiceFiles()
    transform(com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer)

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

tasks.named('build').configure {
    dependsOn shadowJar
}
